[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "sitesignal-apify"
version = "0.1.0"
description = "Evidence-backed business website contacts and technology enrichment, locally and on Apify."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["aiohttp>=3.12,<4", "beautifulsoup4>=4.13,<5"]

[project.optional-dependencies]
actor = ["apify>=3.4,<4"]

[project.scripts]
sitesignal = "sitesignal.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
